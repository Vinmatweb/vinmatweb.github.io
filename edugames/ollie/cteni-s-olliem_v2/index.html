function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function graphemes(w){return w.toLocaleUpperCase('cs').match(/CH|./gu)||[]}
function syllabify(raw){
 if(raw.includes('-'))return raw.split('-').filter(Boolean);
 if(SPLITS[raw])return SPLITS[raw].split('-');
 const g=graphemes(raw), nuclei=[];
 for(let i=0;i<g.length;i++){
  if(VOWELS.includes(g[i])){if(g[i]==='U'&&i>0&&'OAE'.includes(g[i-1])&&nuclei.at(-1)===i-1)continue;nuclei.push(i)}

 }
 if(nuclei.length<2)return [raw];
 let start=0,out=[];
 for(let j=1;j<nuclei.length;j++){const left=nuclei[j-1],right=nuclei[j],cut=right-left===1?right:right-1;out.push(g.slice(start,cut).join(''));start=cut}out.push(g.slice(start).join(''));return out;
}
function parseWords(text){const seen=new Set(),out=[],bad=[];for(let s of text.toLocaleUpperCase('cs').normalize('NFC').split(/[,;\n]+/)){s=s.trim();if(!s)continue;const word=s.replaceAll('-','');if(!/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]+$/u.test(word)||word.length>24||s.startsWith('-')||s.endsWith('-')||s.includes('--')||s.includes('C-H')){bad.push(s);continue}if(!seen.has(word)){seen.add(word);out.push({word,syllables:syllabify(s),manual:s.includes('-')})}}return {words:out,bad}}

function difficulty(results=allResults()){
 const letters={},lengths={},words={};let joins=0,hints=0;
 for(const r of results){words[r.word]=(words[r.word]||0)+(r.status==='helped'?2:r.status==='skipped'?3:0);hints+=r.hints||0;if(r.syllabic)joins++;

}
function chooseWords(pool,n){const d=difficulty(),bag=[...pool],out=[];while(bag.length&&out.length<n){const weights=bag.map(e=>1+Math.min(12,d.words[e.word]||0)+graphemes(e.word).reduce((a,c)=>a+Math.min(4,(d.letters[c]||0)+(d.lengths[c]||0)),0));let x=Math.random()*weights.reduce((a,b)=>a+b,0),i=0;while(i<weights.length-1&&(x-=weights[i])>0)i++;out.push(bag.splice(i,1)[0])}return out}

function helpPage(){page='help';shell(`<h1>Jak číst s ${esc(BRAND.names.instrumental)}</h1><div class="card section stack"><h2>Začněte s dospělým</h2><p>Vyberte lekci a počet slov. Dítě čte zvýrazněnou hlásku, potom celé slovo. Dospělý hodnotí tlačítky nebo klávesami Enter (správně), X (chyba), D (délka), N (nápověda). Přeskočená slova se nepočítají jako přečtená.</p><h2>AI režim na zkoušku</h2><p>V nastavení vložte vlastní Gemini API klíč a ověřte spojení. Zvuk se přenáší živě, výsledek přichází přes funkci evaluate. Modelový hlas se vůbec nepřehrává. Nejistý nebo neplatný výsledek nezpůsobí pochvalu. Po výpadku hodnotí dospělý.</p><p>Pro izolované české hlásky a délky dětské řeči není doložená požadovaná spolehlivost. Číslo jistoty je vlastní odhad modelu, ne kalibrovaná pravděpodobnost. Nejprve porovnejte hodnocení AI s dospělým na skutečných správných i chybných pokusech. Tato aplikace neslibuje fonetické měření.</p><h2>Nápověda a soukromí</h2><p>V nastavení nahrajte vlastní zvukové vzory hlásek. Bez vzoru pomůže s výslovností dospělý; hlas prohlížeče nesupluje hlásky názvy písmen. Při vypnutém hlasu jsou pokyny pouze zobrazené. Slabiky a slova předčítá český hlas prohlížeče. Zvuk se zde nearchivuje; ukládají se výsledky a vámi vložené vzory. Při AI hodnocení dostává zvuk a zadání Google.</p><h2>iPad a jeden soubor</h2><p>Rozhraní, písma a všechen kód jsou uvnitř HTML. Dospělý může hodnotit i bez internetu. V tomto režimu se čas do nápovědy počítá od tlačítka Čti; bez mikrofonu nelze měřit skutečné ticho. AI potřebuje internet a podporovaný účet. Pro přístup k mikrofonu používejte skutečně otevřenou stránku v Safari přes HTTPS; náhled souboru v aplikaci Soubory není spolehlivý způsob spuštění. V Chrome na počítači může fungovat i místní HTML.</p><h2>Procvičování přímo v hlasovém chatu</h2><p>Tlačítkem na úvodní stránce zkopírujete slova a pokyny pro nový hlasový chat. Hlasový chat této aplikaci nevrací výsledky, neovládá zvýrazňování a nesdílí její statistiky. Jednotlivé české hlásky ani délky není poctivé hodnotit jen z textového přepisu.</p><h2>Zdroje a licence</h2><p><a href="https://ai.google.dev/gemini-api/docs/models/gemini-3.8-live" target="_blank" rel="noopener">Gemini Live: model a funkce</a> · <a href="https://ai.google.dev/api/live" target="_blank" rel="noopener">Protokol WebSocket</a> · <a href="https://developers.openai.com/api/docs/guides/voice-webrtc" target="_blank" rel="noopener">OpenAI Realtime a WebRTC</a></p><p class="fine">Dokumentace ověřena 1. 11. 2026. Písma ${esc(BRAND.fonts.reading.family)} (SIL International) a ${esc(BRAND.fonts.ui.family)} (Vernon Adams, Cyreal, Jacques Le Bailly): SIL Open Font License 1.1. Přiložené fonty jsou zmenšené na latinku s českou diakritikou; text licence je uložen v komentáři HTML. Verze ${VERSION}.</p></div><button class="secondary section" data-action="home">Zpět k lekcím</button>`)}

app.addEventListener('change',async e=>{if(e.target.id==='sampleLetter'){sampleLetter=e.target.value;$('#sampleStatus').textContent=sampleSummary()}if(e.target.id==='sampleUpload'){const f=e.target.files[0];if(!f)return;if(f.size>400000){toast('Vzor má být krátký, nejvýše 400 kB.');return}if(!f.type.startsWith('audio/')){toast('Vyberte zvukový soubor.');return}samples[sampleLetter]=await fileData(f);save('samples',samples);$('#sampleStatus').textContent=sampleSummary()}
 if(e.target.id==='restore'){const f=e.target.files[0];if(!f)return;if(f.size>12000000){toast('Záloha je příliš velká.');return}try{const b=JSON.parse(await f.text());if(b.version!==1||!Array.isArray(b.sessions)||typeof b.custom!=='string'||!b.samples||typeof b.samples!=='object'||b.sessions.some(s=>typeof s.id!=='string'||!Number.isFinite(Date.parse(s.started))||!Array.isArray(s.results)||s.results.some(r=>typeof r.word!=='string'||!['independent','helped','skipped'].includes(r.status))))throw Error();for(const [l,a]of Object.entries(b.samples))if(!LETTERS.includes(l)||typeof a!=='string'||!/^data:audio\/[^,]+;base64,[A-Za-z0-9+/=]+$/.test(a))throw Error();if(!confirm('Obnovit zálohu a nahradit současné statistiky, slova a zvuky?'))return;sessions=b.sessions;custom=b.custom;samples=b.samples;save('sessions',sessions);save('custom',custom);save('samples',samples);settingsPage();toast('Záloha obnovena.')}catch{toast('Soubor není platná záloha této aplikace.')}}});
document.addEventListener('keydown',e=>{if(page!=='reading'||e.repeat||e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(!['enter','x','d','n'].includes(k))return;e.preventDefault();if(busy&&live?.pending?.phase==='waiting'){cancelAttempt();busy=false}if(k==='enter'||k==='x')applyVerdict({verdict:k==='enter'?'ok':'wrong',confidence:1,heard:'',vowelErrors:[]});else if(k==='d')lengthChoice();else showHint()});
window.addEventListener('resize',resizeWord);document.fonts?.ready.then(()=>{if(page==='reading')resizeWord()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){viewToken++;cancelAttempt();closeMicrophone();stopSpeech();listenState=null;stopRecording(false);busy=false;if(page==='reading')setStatus('Čtení je pozastavené. Pokračuj tlačítkem Čti.')}else if(page==='reading')requestWake()});
window.addEventListener('pagehide',()=>{persistRun();cleanup()});
try{localStorage.setItem(STORE+'probe','1');localStorage.removeItem(STORE+'probe')}catch{storageOK=false}
renderHome();if(!storageOK)toast('Data nelze ukládat. Pro uchování výsledků použijte zálohu.');
</script>
</body>
</html>
