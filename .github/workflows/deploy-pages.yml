name: Deploy vinmat.eu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vinmat.eu root site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout Edugames source
        uses: actions/checkout@v4
        with:
          repository: Vinmatweb/edugames
          ref: main
          path: edugames-source
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: edugames-source/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Edugames dependencies
        working-directory: edugames-source
        run: pnpm install --frozen-lockfile

      - name: Build Edugames static export
        working-directory: edugames-source
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Assemble full vinmat.eu deployment
        run: |
          mkdir -p publish
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' site/ publish/
          rm -rf publish/edugames
          mkdir -p publish/edugames
          cp -a edugames-source/out/. publish/edugames/
          touch publish/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
