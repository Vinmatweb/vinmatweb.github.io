<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Písmenka s Olliem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Same desk + chalkboard world as Ollie's Classroom / Ollie Reads / Ollie's Numbers. Branding lives here (colours, fonts) and in BRAND in the script. */
:root{
  --desk:#e9c98f; --desk-dark:#c99a55; --board:#24493c; --chalk:#f4f1e4;
  --card:#fffdf6; --ink:#2b2a26; --muted:#6c665a; --accent:#d9561a; --good:#2f9e57; --bad:#e0392b; --star:#ffc21a; --hl:#ffe58a; --mark:#d9561a;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--read);font-size:17px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.035) 0 2px,transparent 2px 38px);overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:10px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:var(--ink);touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;color:var(--board);flex:1;min-width:0}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 0 var(--desk-dark);white-space:nowrap}
.ghost{background:transparent;border:2px solid var(--board);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--board);min-height:40px}
.ghost[aria-pressed="true"]{background:var(--board);color:var(--chalk)}
.board{background:var(--board);color:var(--chalk);border-radius:18px;border:9px solid #8a5a2b;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.owl{width:70px}
.owl.talk svg{animation:bob .45s ease-in-out infinite alternate}
.owl.happy svg{animation:hop .5s ease 2}
@keyframes bob{to{transform:translateY(-4px) rotate(-2deg)}}
@keyframes hop{50%{transform:translateY(-12px) rotate(6deg)}}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,3.2vw,1.8rem);line-height:1.15;text-wrap:balance}
.chalk{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);color:var(--chalk);border-radius:999px;padding:6px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center;min-height:40px;white-space:nowrap}
.progress{height:12px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

.page{background:#fff;border:2px solid #4a4a4a;border-radius:6px;padding:16px 22px;display:flex;align-items:center;justify-content:center;gap:28px;min-height:190px;box-shadow:0 5px 0 var(--desk-dark);flex-wrap:wrap}
.pic{width:min(220px,46vw);aspect-ratio:1;display:grid;place-items:center;border:none;background:transparent;padding:0;border-radius:20px}
.pic svg,.pic img{width:100%;height:100%;object-fit:contain}
.pic:active{transform:scale(.97)}
.word{font-family:var(--read);font-weight:700;font-size:clamp(2.4rem,7vw,4rem);color:#3c3f45;line-height:1.1;letter-spacing:.02em}
.word .first,.word .m{color:var(--mark)}
.target{display:flex;flex-direction:column;align-items:center;gap:4px}
.target .lbl{font-size:.95rem;color:var(--muted)}
.target .big-l{font-family:var(--read);font-weight:700;font-size:clamp(3.4rem,9vw,5rem);line-height:1;color:#fff;background:var(--mark);border-radius:22px;min-width:1.4em;padding:.1em .2em;text-align:center;box-shadow:0 4px 0 #a33f10}
.side{display:flex;flex-direction:column;align-items:center;gap:10px}

.answers{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--card);border:4px solid transparent;border-radius:20px;padding:10px;box-shadow:0 4px 0 var(--desk-dark);display:flex;align-items:center;justify-content:center;min-height:110px;transition:transform .1s;font-family:var(--read);font-weight:700;color:#3c3f45;overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--desk-dark)}
.opt.letter{font-size:clamp(4rem,12vw,6.5rem);line-height:1;min-height:150px}
.opt.wordopt{font-size:clamp(1.6rem,4.4vw,2.6rem)}
.opt .m{color:var(--good);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.opt.right{border-color:var(--good);background:#e6f6eb}
.opt.wrong{border-color:var(--bad);opacity:.45;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.reveal{visibility:hidden}
.reveal.show{visibility:visible;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.big-l.huge{font-size:clamp(6rem,18vw,9rem);border-radius:30px;padding:.05em .3em}
.opt.picopt{flex-direction:column;gap:6px;min-height:170px}
.opt.picopt img,.opt.picopt svg{width:min(150px,100%);aspect-ratio:1;object-fit:contain}
.opt.picopt .cap{font-size:clamp(1.2rem,3.4vw,1.9rem);line-height:1.1}
.opt.picopt .cap .first{color:var(--mark)}
.snd{display:inline-flex;align-items:center;gap:6px}
.snd[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{border:none;border-radius:999px;padding:12px 26px;font-family:var(--display);font-weight:800;font-size:1.35rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.2);min-height:56px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.go{background:var(--accent);color:#fff}.soft{background:#f1e7d0}

/* menu */
.levels{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr))}
.level{background:#fff;border:none;border-left:14px solid var(--c);border-radius:10px 20px 20px 10px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;box-shadow:0 4px 0 var(--desk-dark)}
.level .n{font-family:var(--display);font-weight:800;font-size:.95rem;color:color-mix(in srgb,var(--c) 62%,#000);letter-spacing:.04em;text-transform:uppercase}
.level b{font-family:var(--display);font-size:1.5rem;line-height:1.1;display:block}
.level .d{font-size:.95rem;color:var(--muted)}
.level .ex{grid-row:1/5;grid-column:2;display:flex;align-items:center;gap:6px}
.level .ex img,.level .ex svg{width:60px;height:60px;object-fit:contain}
.level .ex span{font-family:var(--read);font-weight:700;font-size:1.6rem;background:#f1e7d0;border-radius:10px;padding:0 8px}
.level .stars{color:var(--star);letter-spacing:2px}
.level .stars i{color:#e3d6b8;font-style:normal}
.settings{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--desk-dark);display:flex;flex-direction:column;gap:10px}
.settings .lbl{font-family:var(--display);font-weight:800;color:var(--board)}
.settings .lbl small{font-family:var(--read);font-weight:400;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.lchip{border:2px solid #d9cba9;background:transparent;border-radius:12px;min-height:48px;font-family:var(--read);font-weight:700;font-size:1.35rem;color:#9a917e}
.lchip[aria-pressed="true"]{border-color:var(--board);background:#e3f0e8;color:var(--ink)}
.seg{display:inline-flex;background:#f1e7d0;border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;border-radius:999px;padding:8px 16px;min-height:40px;font-weight:700;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--chalk)}
.tog{border:2px solid #d9cba9;background:transparent;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.95rem;min-height:40px}
.tog[aria-pressed="true"]{border-color:var(--board);background:#dfeee6}
.mini{border:none;background:none;color:var(--board);font-weight:700;text-decoration:underline;padding:4px 6px}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result .stars{font-size:2.6rem;color:var(--star);letter-spacing:4px}
.note{font-size:.9rem;color:var(--muted);line-height:1.45;max-width:65ch}
.start{position:fixed;inset:0;background:rgba(36,73,60,.93);display:grid;place-items:center;z-index:10;padding:16px;overflow-y:auto}
.start .in{margin:auto;background:var(--card);border-radius:26px;padding:22px;max-width:540px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.start h2{font-family:var(--display);font-size:2rem;margin:0;color:var(--board)}
.credit{font-size:.75rem;color:var(--muted);text-align:center}
@media (max-width:600px){.opt.picopt{min-height:120px;padding:6px}.snd{font-size:0;gap:0;padding:7px 10px}.answers.words{grid-template-columns:minmax(0,1fr)}.opt.wordopt{min-height:72px;overflow-wrap:normal}.level .ex span{display:none}.board{grid-template-columns:auto minmax(0,1fr)}.board .chalk{grid-column:1/-1;justify-self:start}.owl{width:52px}.opt.letter{min-height:110px}.page{gap:14px;padding:12px}}
@media (orientation:portrait) and (min-width:700px){.page{min-height:34vh}.opt{min-height:16vh}.pic{width:min(280px,42vw)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<main class="wrap" id="app"></main>
<div class="start" id="start"><div class="in" id="startIn"></div></div>

<script>

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(BRAND.prefix+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(BRAND.prefix+k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const letterOf=w=>w.startsWith("ch")?"CH":w[0].toUpperCase();
const pic=it=>PICS[it.p]||"";

let S=Object.assign({caps:true,sayWord:true,mute:false,on:LETTERS.slice()},store.get("settings",{}));
S.on=S.on.filter(l=>LETTERS.includes(l));if(!S.on.length)S.on=LETTERS.slice();
const save=()=>store.set("settings",S);
let BEST=store.get("best",{});

/* show text in capitals or small letters (Czech-aware) */
const up=s=>S.caps?s.toLocaleUpperCase("cs-CZ"):s;
const showL=L=>S.caps?L:L.toLowerCase();

/* positions of letter L inside word (Ch counts as one letter) */
function hits(word,L){
  const w=word.toLowerCase(),l=L.toLowerCase(),out=[];
  for(let i=0;i<w.length;i++){
    if(l==="ch"){if(w.slice(i,i+2)==="ch"){out.push([i,2]);i++}continue}
    if(w[i]!==l)continue;
    if(l==="c"&&w[i+1]==="h")continue;
    if(l==="h"&&w[i-1]==="c")continue;
    out.push([i,1]);
  }
  return out;
}
function markHTML(word,L,cls){
  const h=hits(word,L),txt=up(word);let out="",p=0;
  h.forEach(([i,n])=>{out+=esc(txt.slice(p,i))+`<span class="${cls}">${esc(txt.slice(i,i+n))}</span>`;p=i+n});
  return out+esc(txt.slice(p));
}

function firstHTML(word,L){const n=L.length,t=up(word);return `<span class="first">${esc(t.slice(0,n))}</span>${esc(t.slice(n))}`}

/* ---------- voice & sound ---------- */
const SND_ON=`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const SND_OFF=`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
let VOICE=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices().filter(x=>/^cs/i.test(x.lang));
  const q=x=>(/premium|enhanced|vylepšen|neural|natural|online/i.test(x.name)?2:0)+(x.localService?1:0);
  VOICE=v.sort((a,b)=>q(b)-q(a))[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();if(!started)renderStart()}}
function say(text,done,rate){
  let fired=false;const fin=()=>{if(fired)return;fired=true;document.querySelector(".owl")?.classList.remove("talk");done&&done()};
  if(!text){setTimeout(fin,300);return}
  /* sound off: keep the same rhythm, just silent */
  if(S.mute||!("speechSynthesis" in window)){setTimeout(fin,900+text.length*20);return}
  if(!VOICE)pickVoice();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="cs-CZ";if(VOICE)u.voice=VOICE;u.rate=rate||.9;u.pitch=1.08;
  u.onend=fin;u.onerror=fin;document.querySelector(".owl")?.classList.add("talk");
  speechSynthesis.speak(u);setTimeout(fin,1400+text.length*90);
}
let AC=null;
function tone(fs,d=.12,type="triangle",vol=.13){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();let t=AC.currentTime;fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}

function safeFor(L,exclude){
  return DATA.items.filter(x=>{const xl=letterOf(x.w);
    return x!==exclude&&xl!==L&&!(CLASH[L]||[]).includes(xl)&&!(x.no||[]).includes(L)});
}
function makeRound(lv){
  const pool=poolFor(lv);let list=[];
  while(list.length<ROUND){let s=shuffle(pool);if(list.length&&s[0]===list[list.length-1]&&s.length>1)s.push(s.shift());list=list.concat(s)}
  list=list.slice(0,ROUND);
  return list.map(it=>{
    const L=letterOf(it.w);
    if(lv==="l1"){
      const avoid=new Set([L,...(it.no||[]),...(CLASH[L]||[])]);
      let src=S.on.filter(x=>!avoid.has(x));
      if(src.length<2)src=LETTERS.filter(x=>!avoid.has(x));
      return {lv,it,L,opts:shuffle([L,...shuffle(src).slice(0,2)])};
    }
    if(lv==="l2")return {lv,it,L,opts:shuffle(it.f.map((w,i)=>({w,ok:i===0})))};
    /* l3: two other pictures with two different first letters */
    const d=[];for(const x of shuffle(safeFor(L,it))){if(d.length===2)break;if(!d.some(y=>letterOf(y.w)===letterOf(x.w)))d.push(x)}
    return {lv,it,L,opts:shuffle([it,...d]).map(x=>({it:x,ok:x===it}))};
  });
}

/* ---------- screens ---------- */
let LV=null,R=[],ri=0,stars=0,tries=0,locked=false;
const app=$("app");
function topBar(right=""){return `<div class="top"><h1>${BRAND.title}</h1>${right}${muteBtn()}</div>`}
function board(text){return `<div class="board"><div class="owl">${OWL}</div><div class="prompt">${esc(text)}</div><button class="chalk" id="again">${SPK} Znovu</button></div>`}
function starStr(n){return "★".repeat(n)+`<i>${"★".repeat(Math.max(0,ROUND-n))}</i>`}
const cap=s=>s[0].toUpperCase()+s.slice(1);

function menu(silent){
  const ex=w=>DATA.items.find(i=>i.w===w);
  const exHTML={l1:pic(ex("sova"))+`<span>${showL("S")}</span>`,l2:pic(ex("most"))+`<span>${up("kamenný")}</span>`,l3:`<span>${showL("L")}</span>`+pic(ex("lev"))};
  app.innerHTML=topBar()+board("Vyber si hru!")+
   `<div class="levels">${LEVELS.map(l=>`<button class="level" style="--c:${l.color}" data-id="${l.id}"><span class="n">${l.num}</span>
     <span class="ex">${exHTML[l.id]}</span>
     <b>${l.title}</b><span class="d">${l.d}</span><span class="stars">${starStr(BEST[l.id]||0)}</span></button>`).join("")}</div>
   <div class="settings">
     <span class="lbl">Pro rodiče <small>– ťuknutím na obrázek ho Ollie pojmenuje</small></span>
     <div class="row"><span>Písmo:</span><div class="seg" role="group" aria-label="Velikost písmen"><button id="capsOn" aria-pressed="${S.caps}">ABC</button><button id="capsOff" aria-pressed="${!S.caps}">abc</button></div>
       <button class="tog" id="tSay" aria-pressed="${S.sayWord}">Ollie řekne, co je na obrázku</button></div>
     <span class="lbl">Písmenka ve hře <small>(${S.on.length} z ${LETTERS.length}; vyberte ta, která dítě už zná)</small></span>
     <div class="lchips">${LETTERS.map(l=>`<button class="lchip" data-l="${l}" aria-pressed="${S.on.includes(l)}">${showL(l)}</button>`).join("")}</div>
     <div class="row"><button class="mini" id="allOn">Vybrat všechna</button><button class="mini" id="allOff">Zrušit výběr</button></div>
   </div>
   <p class="credit">Obrázky: Microsoft Fluent Emoji 3D (licence MIT) a vlastní kresby.</p>`;
  $("again").onclick=()=>say("Vyber si hru!");
  app.querySelectorAll(".level").forEach(b=>b.onclick=()=>{LV=b.dataset.id;R=makeRound(LV);ri=0;stars=0;task()});
  $("capsOn").onclick=()=>{S.caps=true;save();menu(true)};
  $("capsOff").onclick=()=>{S.caps=false;save();menu(true)};
  $("tSay").onclick=()=>{S.sayWord=!S.sayWord;save();menu(true)};
  app.querySelectorAll(".lchip").forEach(b=>b.onclick=()=>{
    const l=b.dataset.l;
    if(S.on.includes(l)){if(S.on.length===1)return;S.on=S.on.filter(x=>x!==l)}else S.on=LETTERS.filter(x=>S.on.includes(x)||x===l);
    save();menu(true);
  });
  $("allOn").onclick=()=>{S.on=LETTERS.slice();save();menu(true)};
  $("allOff").onclick=()=>{S.on=[S.on[0]||"A"];save();menu(true)};
  if(!silent)say("Vyber si hru!");
}

function promptFor(T){
  const w=T.it.w;
  if(T.lv==="l1")return {show:"Na co to začíná?",speak:S.sayWord?cap(w)+".":""};
  if(T.lv==="l2")return {show:"Ve kterém slově je písmenko, na které začíná obrázek?",speak:`Ve kterém slově je písmeno, na které začíná ${S.sayWord?w:"obrázek"}?`};
  return {show:`Který obrázek začíná na ${showL(T.L)}?`,speak:`Který obrázek začíná na ${SAYL[T.L]}?`};
}

function task(){
  const T=R[ri];tries=0;locked=false;
  const P=promptFor(T);
  const head=topBar(`<button class="ghost" id="home">Menu</button><span class="pill">★ ${stars}</span>`)+`<div class="progress"><span style="width:${ri/R.length*100}%"></span></div>`;
  const picBtn=`<button class="pic" id="picBtn" aria-label="Obrázek – poslechnout">${pic(T.it)}</button>`;
  /* the word is there from the start but invisible, so nothing jumps when it appears */
  const reveal=`<div class="word reveal" id="reveal">${firstHTML(T.it.w,T.L)}</div>`;
  let body;
  if(T.lv==="l1"){
    body=`<div class="page">${picBtn}${reveal}</div>
      <div class="answers">${T.opts.map(L=>`<button class="opt letter" data-v="${L}" aria-label="písmeno ${L}">${showL(L)}</button>`).join("")}</div>`;
  }else if(T.lv==="l2"){
    body=`<div class="page">${picBtn}${reveal}</div>
      <div class="answers words">${T.opts.map((o,i)=>`<button class="opt wordopt" data-i="${i}">${esc(up(o.w))}</button>`).join("")}</div>`;
  }else{
    body=`<div class="page"><div class="target"><span class="big-l huge">${showL(T.L)}</span></div></div>
      <div class="answers">${T.opts.map((o,i)=>`<button class="opt picopt" data-i="${i}" aria-label="obrázek ${i+1}">${pic(o.it)}<span class="cap reveal">${firstHTML(o.it.w,letterOf(o.it.w))}</span></button>`).join("")}</div>`;
  }
  app.innerHTML=head+board(P.show)+body;
  $("home").onclick=()=>{speechSynthesis?.cancel();menu(true)};
  $("again").onclick=()=>say(P.speak||"Na co začíná obrázek?");
  if($("picBtn"))$("picBtn").onclick=()=>say(T.it.w,null,.8);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b));
  say(P.speak);
}

function choose(b){
  if(locked||b.classList.contains("wrong"))return;
  const T=R[ri],w=T.it.w;
  let ok,line;
  if(T.lv==="l1"){
    const v=b.dataset.v;ok=v===T.L;
    line=ok?`${pick(PRAISE)} ${cap(w)} začíná na ${SAYL[T.L]}.`:(S.sayWord?`${cap(w)} nezačíná na ${SAYL[v]}. Zkus to znovu.`:"Ne, zkus to znovu.");
  }else if(T.lv==="l2"){
    const o=T.opts[+b.dataset.i];ok=o.ok;
    line=ok?`${pick(PRAISE)} ${cap(w)} začíná na ${SAYL[T.L]} a ${SAYL[T.L]} je i ve slově ${o.w}.`:`Ve slově ${o.w} není písmeno, na které začíná ${w}. Zkus jiné slovo.`;
    if(ok)b.innerHTML=markHTML(o.w,T.L,"m");
  }else{
    const o=T.opts[+b.dataset.i];ok=o.ok;
    b.querySelector(".cap").classList.add("show");
    line=ok?`${pick(PRAISE)} ${cap(w)} začíná na ${SAYL[T.L]}.`:`To je ${o.it.w}. Zkus to znovu.`;
  }
  if(!ok){tries++;b.classList.add("wrong");tone([220,170],.18,"sawtooth",.06);say(line);return}
  locked=true;b.classList.add("right");if(tries===0)stars++;
  $("reveal")?.classList.add("show");
  tone([660,880,1320]);document.querySelector(".owl")?.classList.add("happy");
  const t0=Date.now();
  say(line,()=>setTimeout(next,Math.max(450,1800-(Date.now()-t0))));
}

function next(){ri++;if(ri<R.length)task();else results()}
function results(){
  if((BEST[LV]||0)<stars){BEST[LV]=stars;store.set("best",BEST)}
  const msg=stars>=R.length?"Všechny hvězdičky! Jsi jednička!":stars>=7?"Výborně! To ti jde!":"Dobrá práce! Zkusíme to znovu?";
  app.innerHTML=topBar()+board(msg)+
   `<div class="result"><div class="stars" aria-label="${stars} z ${R.length}">${"★".repeat(stars)}<span style="color:#e3d6b8">${"★".repeat(R.length-stars)}</span></div>
    <p>Hvězdičky: ${stars} z ${R.length}</p>
    <div class="acts"><button class="big go" id="replay">Hrát znovu</button><button class="big soft" id="back">Menu</button></div></div>`;
  $("again").onclick=()=>say(msg);
  $("replay").onclick=()=>{R=makeRound(LV);ri=0;stars=0;task()};
  $("back").onclick=()=>menu(true);
  document.querySelector(".owl").classList.add("happy");
  tone([523,659,784,1047],.14);say(msg);
}

/* ---------- start overlay (lets iPad play sound) ---------- */
let started=false;
function renderStart(){
  if(started)return;
  const noCs="speechSynthesis" in window&&speechSynthesis.getVoices().length&&!VOICE;
  $("startIn").innerHTML=`<div style="width:100px">${OWL}</div><h2>${BRAND.title}</h2>
   <button class="big go" id="goBtn">Začít</button>
   ${noCs?`<p class="note" style="color:var(--bad)">Na tomto zařízení chybí český hlas. iPad: Nastavení → Přístupnost → Mluvený obsah → Hlasy → Čeština → Zuzana.</p>`:""}`;
  $("goBtn").onclick=()=>{started=true;$("start").hidden=true;tone([1],.01);say("Ahoj!")};
}
document.documentElement.lang="cs";
renderStart();
menu(true);
</script>
