            renderCmfTab() {

            renderDiagramTab() {
                const currentNode = DIAGRAM_NODES.find(n => n.id === this.state.selectedDiagramNodeId) || DIAGRAM_NODES[0];
                const currentLink = DIAGRAM_LINKS.find(l => l.id === this.state.selectedDiagramLinkId);

                const getNodeX = id => (DIAGRAM_NODES.find(n => n.id === id) || {x:0}).x;
                const getNodeY = id => (DIAGRAM_NODES.find(n => n.id === id) || {y:0}).y;
                const getLinkColor = type => {
                    switch(type) {
                        case 'alliance': return '#10b981';
                        case 'rivalry': return '#ef4444';
                        case 'outlaw': return '#f59e0b';
                        case 'magic': return '#a855f7';
                        default: return '#d4af37';
                    }
                };

                // Compute node relations for detail sidebar (only show non-empty categories)
                const nodeRelations = DIAGRAM_LINKS.filter(l => l.source === currentNode.id || l.target === currentNode.id);
                const relTypes = [
                    { type: 'alliance', label: '🤝 Spojenci', color: 'text-emerald-400' },
                    { type: 'rivalry', label: '⚔️ Rivalové & Protivníci', color: 'text-red-400' },
                    { type: 'outlaw', label: '🌲 Psanci & Zbojníci', color: 'text-amber-400' },
                    { type: 'magic', label: '🔮 Magické Síly', color: 'text-purple-400' }
                ];

                const renderedRelationsHtml = relTypes.map(rt => {
                    const matchingLinks = nodeRelations.filter(l => l.type === rt.type);
                    if (matchingLinks.length === 0) return '';

                    const itemsHtml = matchingLinks.map(l => {
                        const otherId = l.source === currentNode.id ? l.target : l.source;
                        const otherFac = window.app.getFaction(otherId);
                        return `
                            <div onclick="window.app.selectDiagramLink('${l.id}')" class="flex items-center justify-between p-2 rounded bg-black/40 border border-castle-gold/10 hover:border-castle-gold/40 cursor-pointer transition text-xs">
                                <div class="flex items-center gap-2">
                                    <span>${otherFac.icon}</span>
                                    <span class="font-semibold text-gray-200">${otherFac.name}</span>
                                </div>
                                <span class="text-[10px] text-amber-300 font-mono hover:underline">${l.shortLabel} &rarr;</span>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="space-y-1.5">
                            <h4 class="text-xs font-cinzel font-bold ${rt.color}">${rt.label}</h4>
                            <div class="space-y-1">${itemsHtml}</div>
                        </div>
                    `;
                }).filter(html => html !== '').join('');

                return `
                    <section class="space-y-8">
                        <div class="stone-card p-6 rounded-2xl border-2 border-castle-gold/30 shadow-xl space-y-6">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-castle-gold/20 pb-4">
                                <div>
                                    <h2 class="text-2xl sm:text-3xl font-cinzel font-bold gold-gradient-text">
                                        🕸️ Interaktivní Diagram Vztahů Frakcí
                                    </h2>
                                    <p class="text-xs sm:text-sm text-gray-400">
                                        Prozkoumejte historická spojenectví, rivality, psance a magické konflikty mezi hlavními hradními frakcemi.
                                    </p>
                                </div>

                                <div class="flex flex-wrap gap-3 text-xs">
                                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> Spojenectví</span>
                                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500"></span> Rivalita</span>
                                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> Psanci</span>
                                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-purple-500"></span> Magie</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                <!-- SVG Canvas -->
                                <div class="lg:col-span-8 bg-castle-stoneDark rounded-xl p-4 border border-castle-gold/20 shadow-inner relative overflow-hidden min-h-[480px]">
                                    <svg class="w-full h-[480px]" viewBox="0 0 800 550">
                                        <!-- Lines -->
                                        <g>
                                            ${DIAGRAM_LINKS.map(l => `
                                                <line 
                                                    x1="${getNodeX(l.source)}" y1="${getNodeY(l.source)}" 
                                                    x2="${getNodeX(l.target)}" y2="${getNodeY(l.target)}"
                                                    stroke="${getLinkColor(l.type)}"
                                                    stroke-width="${this.state.selectedDiagramLinkId === l.id ? 5 : 2.5}"
                                                    stroke-dasharray="${l.type === 'outlaw' ? '6,6' : 'none'}"
                                                    class="cursor-pointer hover:stroke-amber-200 transition"
                                                    onclick="window.app.selectDiagramLink('${l.id}')"
                                                />
                                            `).join('')}
                                        </g>

                                        <!-- Nodes -->
                                        <g>
                                            ${DIAGRAM_NODES.map(n => `
                                                <g class="cursor-pointer" onclick="window.app.selectDiagramNode('${n.id}')">
                                                    <circle 
                                                        cx="${n.x}" cy="${n.y}" r="30" 
                                                        fill="${n.colorBg}"
                                                        stroke="${this.state.selectedDiagramNodeId === n.id ? '#d4af37' : '#4b5563'}"
                                                        stroke-width="${this.state.selectedDiagramNodeId === n.id ? 4 : 2}"
                                                    />
                                                    <text x="${n.x}" y="${n.y + 6}" text-anchor="middle" font-size="22" pointer-events="none">${n.icon}</text>
                                                    <text x="${n.x}" y="${n.y + 45}" text-anchor="middle" fill="#f3e5ab" font-family="Cinzel" font-size="12" font-weight="bold" pointer-events="none">${n.shortName}</text>
                                                </g>
                                            `).join('')}
                                        </g>
                                    </svg>
                                </div>

                                <!-- Detail Sidebar -->
                                <div class="lg:col-span-4 stone-card p-6 rounded-xl border border-castle-gold/30 space-y-4">
                                    ${currentLink ? `
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-black/60 text-amber-300 border border-castle-gold/30">
                                                ${currentLink.shortLabel}
                                            </span>
                                            <button onclick="window.app.selectDiagramNode('${currentLink.source}')" class="text-xs text-gray-400 hover:text-white">&larr; Zpět na frakci</button>
                                        </div>
                                        <h3 class="text-lg font-cinzel font-bold text-white mt-1">
                                            ${this.getFaction(currentLink.source).name} & ${this.getFaction(currentLink.target).name}
                                        </h3>
                                        <p class="text-xs text-gray-300 leading-relaxed bg-black/40 p-3 rounded-lg border border-castle-gold/15">
                                            ${currentLink.description}
                                        </p>
                                        <button onclick="window.app.selectFaction('${currentLink.source}'); window.app.switchTab('factions');" class="w-full py-2 bg-castle-stoneMid hover:bg-castle-stoneLight text-amber-300 text-xs font-cinzel font-bold rounded border border-castle-gold/30 transition">
                                            Přejít na ${this.getFaction(currentLink.source).name} &rarr;
                                        </button>
                                    ` : `
                                        <div class="flex items-center gap-3">
                                            <div class="w-12 h-12 rounded-lg flex items-center justify-center text-2xl border border-castle-gold/40 shadow" style="background-color: ${currentNode.colorBg}">
                                                ${currentNode.icon}
                                            </div>
                                            <div>
                                                <h3 class="font-cinzel font-bold text-lg text-white">${currentNode.name}</h3>
                                                <span class="text-xs text-amber-300 font-serif italic">${currentNode.shortName}</span>
                                            </div>
                                        </div>
                                        <p class="text-xs text-gray-300 leading-relaxed bg-black/40 p-3 rounded-lg border border-castle-gold/15">
                                            ${currentNode.loreSummary}
                                        </p>

                                        ${renderedRelationsHtml ? `
                                            <div class="space-y-3 pt-2 border-t border-castle-gold/20">
                                                ${renderedRelationsHtml}
                                            </div>
                                        ` : ''}

                                        <button onclick="window.app.selectFaction('${currentNode.id}'); window.app.switchTab('factions');" class="w-full py-2.5 gold-gradient-bg text-black font-cinzel font-bold text-xs rounded shadow hover:brightness-110 transition mt-2">
                                            Otevřít Podstránku Frakce &rarr;
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
            },

            renderSetsTab() {
                const filtered = SETS.filter(s => {
                    const matchCat = this.state.setCategoryFilter === 'ALL' || s.category === this.state.setCategoryFilter;
                    const matchFac = this.state.setFactionFilter === 'ALL' || s.factionId === this.state.setFactionFilter;
                    const q = this.state.setSearchQuery.toLowerCase();
                    const matchQ = !q || s.name.toLowerCase().includes(q) || s.czechName.toLowerCase().includes(q) || s.number.toLowerCase().includes(q) || s.description.toLowerCase().includes(q);
                    return matchCat && matchFac && matchQ;
                }).sort((a, b) => {
                    if (this.state.setSortBy === 'year_desc') return b.year - a.year;
                    if (this.state.setSortBy === 'year_asc') return a.year - b.year;
                    if (this.state.setSortBy === 'pieces_desc') return b.pieces - a.pieces;
                    if (this.state.setSortBy === 'number_asc') return parseInt(a.number) - parseInt(b.number);
                    return 0;
                });

                return `
                    <section class="space-y-8">
                        <div class="stone-card p-6 rounded-2xl border-2 border-castle-gold/30 shadow-xl space-y-6">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-castle-gold/20 pb-4">
                                <div>
                                    <h2 class="text-2xl sm:text-3xl font-cinzel font-bold gold-gradient-text">
                                        🏰 Kompletní Databáze Hradních Setů
                                    </h2>
                                    <p class="text-xs sm:text-sm text-gray-400">
                                        Prohlížejte aktivní sety z LEGO.cz, vyřazené historické klasiky, LEGO Ideas, Icons a BrickLink Designer Program (BDP).
                                    </p>
                                </div>
                            </div>

                            <!-- Filter Controls -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-cinzel text-amber-300 mb-1">Vyhledat set / číslo</label>
                                    <input type="text" value="${this.state.setSearchQuery}" oninput="window.app.state.setSearchQuery=this.value; window.app.renderApp()" placeholder="např. 10305, Kovář..." class="w-full bg-castle-stoneMid text-sm text-gray-200 rounded-lg px-3 py-2 border border-castle-gold/30 focus:outline-none"/>
                                </div>

                                <div>
                                    <label class="block text-xs font-cinzel text-amber-300 mb-1">Dostupnost & Řada</label>
                                    <select onchange="window.app.state.setCategoryFilter=this.value; window.app.renderApp()" class="w-full bg-castle-stoneMid text-sm text-gray-200 rounded-lg px-3 py-2 border border-castle-gold/30 focus:outline-none">
                                        <option value="ALL" ${this.state.setCategoryFilter==='ALL'?'selected':''}>Všechny kategorie</option>
                                        <option value="lego_cz" ${this.state.setCategoryFilter==='lego_cz'?'selected':''}>🛒 V prodeji na LEGO.cz</option>
                                        <option value="bdp" ${this.state.setCategoryFilter==='bdp'?'selected':''}>🧱 BrickLink BDP</option>
                                        <option value="ideas_icons" ${this.state.setCategoryFilter==='ideas_icons'?'selected':''}>💡 LEGO Ideas & Icons</option>
                                        <option value="retired" ${this.state.setCategoryFilter==='retired'?'selected':''}>🏛️ Vyřazené Klasiky</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-cinzel text-amber-300 mb-1">Frakce (13)</label>
                                    <select onchange="window.app.state.setFactionFilter=this.value; window.app.renderApp()" class="w-full bg-castle-stoneMid text-sm text-gray-200 rounded-lg px-3 py-2 border border-castle-gold/30 focus:outline-none">
                                        <option value="ALL" ${this.state.setFactionFilter==='ALL'?'selected':''}>Všechny frakce</option>
                                        ${FACTIONS.map(f => `<option value="${f.id}" ${this.state.setFactionFilter===f.id?'selected':''}>${f.name}</option>`).join('')}
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-cinzel text-amber-300 mb-1">Řadit podle</label>
                                    <select onchange="window.app.state.setSortBy=this.value; window.app.renderApp()" class="w-full bg-castle-stoneMid text-sm text-gray-200 rounded-lg px-3 py-2 border border-castle-gold/30 focus:outline-none">
                                        <option value="year_desc" ${this.state.setSortBy==='year_desc'?'selected':''}>Nejnovější (podle roku)</option>
                                        <option value="year_asc" ${this.state.setSortBy==='year_asc'?'selected':''}>Nejstarší (podle roku)</option>
                                        <option value="pieces_desc" ${this.state.setSortBy==='pieces_desc'?'selected':''}>Největší (podle dílků)</option>
                                        <option value="number_asc" ${this.state.setSortBy==='number_asc'?'selected':''}>Čísla setu</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Set Cards Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            ${filtered.map(s => `
                                <div onclick="window.app.openSetModal('${s.id}')" class="stone-card rounded-2xl border border-castle-gold/30 hover:border-castle-gold p-5 flex flex-col justify-between transition cursor-pointer group shadow-xl">
                                    <div>
                                        <div class="flex items-center justify-between gap-2 mb-3">
                                            <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-black/60 text-amber-300 border border-castle-gold/30">
                                                #${s.number}
                                            </span>
                                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded ${this.getCategoryBadgeClass(s.category)}">
                                                ${this.getCategoryLabel(s.category)}
                                            </span>
                                        </div>

                                        <h3 class="font-cinzel font-bold text-lg text-white group-hover:text-amber-300 transition line-clamp-2 mb-1">
                                            ${s.czechName}
                                        </h3>
                                        <p class="text-xs font-serif italic text-gray-400 mb-3">${s.name}</p>

                                        <div class="flex items-center gap-1.5 mb-3">
                                            <span class="text-base">${this.getFaction(s.factionId).icon}</span>
                                            <span class="text-xs font-semibold text-amber-200/90">${this.getFaction(s.factionId).name}</span>
                                        </div>

                                        <p class="text-xs text-gray-300 line-clamp-3 leading-relaxed mb-4">
                                            ${s.description}
                                        </p>
                                    </div>

                                    <div class="pt-3 border-t border-gray-700/60 flex items-center justify-between text-xs text-gray-400">
                                        <div>
                                            <span class="font-semibold text-gray-200">${s.year}</span> • <span>${s.pieces} pcs</span>
                                        </div>
                                        <span class="text-amber-400 font-bold flex items-center gap-0.5">
                                            Detail &rarr;
                                        </span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            },

            openDiagramNode(id) {
                this.state.selectedDiagramNodeId = id;
                this.state.selectedDiagramLinkId = null;
                this.switchTab('diagram');
            },

            selectDiagramNode(id) {
                this.state.selectedDiagramNodeId = id;
                this.state.selectedDiagramLinkId = null;
                this.renderApp();
            },

            selectDiagramLink(id) {
                this.state.selectedDiagramLinkId = id;
                this.renderApp();
            },

            openSetModal(setId) {
                const s = SETS.find(item => item.id === setId);
                if (!s) return;

                const fac = this.getFaction(s.factionId);
                const modal = document.getElementById('modal-content');
                
                modal.innerHTML = `
                    <button onclick="window.app.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold bg-castle-stoneMid w-8 h-8 rounded-full border border-castle-gold/30 flex items-center justify-center">✕</button>

                    <div class="space-y-2 border-b border-castle-gold/30 pb-4">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs font-mono font-bold px-2.5 py-1 rounded bg-black/80 text-amber-300 border border-castle-gold/40">#${s.number}</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded ${this.getCategoryBadgeClass(s.category)}">${this.getCategoryLabel(s.category)}</span>
                            <span class="text-xs px-2.5 py-1 rounded bg-castle-stoneLight text-gray-300 border border-gray-600">Rok ${s.year}</span>
                        </div>
                        <h3 class="text-2xl sm:text-3xl font-cinzel font-bold text-white mt-1">${s.czechName}</h3>
                        <p class="text-sm text-amber-300 font-serif italic">${s.name}</p>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 my-4">
                        <div class="p-3 bg-black/40 rounded-lg border border-castle-gold/20">
                            <div class="text-[10px] text-gray-400 font-cinzel uppercase">Frakce</div>
                            <div class="text-xs font-bold text-amber-200 flex items-center gap-1 mt-0.5">
                                <span>${fac.icon}</span> <span>${fac.name}</span>
                            </div>
                        </div>
                        <div class="p-3 bg-black/40 rounded-lg border border-castle-gold/20">
                            <div class="text-[10px] text-gray-400 font-cinzel uppercase">Počet dílků</div>
                            <div class="text-xs font-bold text-amber-200 mt-0.5">${s.pieces} pcs</div>
                        </div>
                        <div class="p-3 bg-black/40 rounded-lg border border-castle-gold/20 col-span-2 sm:col-span-1">
                            <div class="text-[10px] text-gray-400 font-cinzel uppercase">Cena / Stav</div>
                            <div class="text-xs font-bold text-emerald-400 mt-0.5">${s.priceCzech || 'Vyřazeno / Sběratelské'}</div>
                        </div>
                    </div>

                    <div class="space-y-2 my-4">
                        <h4 class="text-sm font-cinzel font-bold text-castle-gold">Popis setu a historie</h4>
                        <p class="text-sm text-gray-300 leading-relaxed bg-castle-stoneDark/80 p-4 rounded-xl border border-castle-gold/10">${s.description}</p>
                    </div>

                    ${s.minifigs ? `
                        <div class="space-y-2 my-4">
                            <h4 class="text-sm font-cinzel font-bold text-castle-gold">Obsažené Minifigurky & Prvky</h4>
                            <p class="text-xs text-gray-300 bg-black/30 p-3 rounded-lg border border-castle-gold/10">${s.minifigs}</p>
                        </div>
                    ` : ''}

                    <div class="pt-4 border-t border-castle-gold/30 flex flex-wrap items-center justify-between gap-3">
                        ${s.category === 'lego_cz' ? `
                            <a href="https://www.lego.com/cs-cz" target="_blank" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-cinzel font-bold transition">
                                🛒 Zobrazit na LEGO.cz
                            </a>
                        ` : ''}
                        <a href="https://www.bricklink.com" target="_blank" class="px-4 py-2 bg-castle-stoneMid hover:bg-castle-stoneLight text-amber-300 rounded-lg text-xs font-cinzel font-bold border border-castle-gold/30 transition">
                            🧱 Hledat na BrickLink.com
                        </a>
                    </div>
                `;

                document.getElementById('modal-backdrop').classList.remove('hidden');
                document.getElementById('modal-backdrop').classList.add('flex');
            },

            openExportModal() {
                const modal = document.getElementById('modal-content');
                modal.innerHTML = `
                    <button onclick="window.app.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold bg-castle-stoneMid w-8 h-8 rounded-full border border-castle-gold/30 flex items-center justify-center">✕</button>

                    <div class="space-y-2 border-b border-castle-gold/30 pb-3">
                        <h3 class="text-2xl font-cinzel font-bold text-white flex items-center gap-2">
                            📥 Možnosti Stažení a Exportu
                        </h3>
                        <p class="text-xs text-gray-400">
                            Vyberte požadovaný formát pro export kompletní databáze frakcí, setů nebo CMF minifigurek.
                        </p>
                    </div>

                    <div class="space-y-3 my-6">
                        <button onclick="window.app.downloadSetsCSV()" class="w-full p-4 rounded-xl bg-castle-stoneMid border border-castle-gold/30 hover:border-castle-gold transition flex items-center justify-between">
                            <div class="text-left">
                                <div class="font-cinzel font-bold text-amber-200 text-sm">📊 Stáhnout Databázi Setů (CSV)</div>
                                <div class="text-xs text-gray-400">Tabulka všech setů (číslo, název, rok, dílky, cena, frakce)</div>
                            </div>
                            <span class="text-xl">📄</span>
                        </button>

                        <button onclick="window.app.downloadCMFCatalog()" class="w-full p-4 rounded-xl bg-castle-stoneMid border border-purple-500/30 hover:border-purple-400 transition flex items-center justify-between">
                            <div class="text-left">
                                <div class="font-cinzel font-bold text-purple-300 text-sm">🧩 Stáhnout CMF Minifigurky (CSV)</div>
                                <div class="text-xs text-gray-400">Přehled všech CMF sérií, doplňků a příslušných frakcí</div>
                            </div>
                            <span class="text-xl">🧩</span>
                        </button>

                        <button onclick="window.app.downloadFullJSON()" class="w-full p-4 rounded-xl bg-castle-stoneMid border border-emerald-500/30 hover:border-emerald-400 transition flex items-center justify-between">
                            <div class="text-left">
                                <div class="font-cinzel font-bold text-emerald-300 text-sm">⚙️ Kompletní JSON Archív</div>
                                <div class="text-xs text-gray-400">Kompletní strukturovaný JSON (Frakce, Sety, CMF, Diagram)</div>
                            </div>
                            <span class="text-xl">💾</span>
                        </button>
                    </div>
                `;

                document.getElementById('modal-backdrop').classList.remove('hidden');
                document.getElementById('modal-backdrop').classList.add('flex');
            },

            closeModal() {
                document.getElementById('modal-backdrop').classList.add('hidden');
                document.getElementById('modal-backdrop').classList.remove('flex');
            },

            downloadSetsCSV() {
                let csv = 'Cislo,Nazev,CeskyNazev,Rok,Dilky,Frakce,Kategorie,Cena\n';
                SETS.forEach(s => {
                    csv += `"${s.number}","${s.name}","${s.czechName}",${s.year},${s.pieces},"${this.getFaction(s.factionId).name}","${this.getCategoryLabel(s.category)}","${s.priceCzech || ''}"\n`;
                });
                this.triggerDownload(csv, 'lego_castle_sets.csv', 'text/csv');
            },

            downloadCMFCatalog() {
                let csv = 'Serie,Nazev,CeskyNazev,Rok,Frakce,Doplnky,Popis\n';
                CMF_MINIFIGS.forEach(f => {
                    csv += `"${f.series}","${f.name}","${f.czechName}",${f.year},"${this.getFaction(f.factionId).name}","${f.accessories}","${f.description}"\n`;
                });
                this.triggerDownload(csv, 'lego_castle_cmf_catalog.csv', 'text/csv');
            },

            downloadFullJSON() {
                const data = { FACTIONS, SETS, CMF_MINIFIGS, DIAGRAM_NODES, DIAGRAM_LINKS };
                this.triggerDownload(JSON.stringify(data, null, 2), 'lego_castle_codex.json', 'application/json');
            },

            triggerDownload(content, filename, type) {
                const blob = new Blob([content], { type: type + ';charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                this.closeModal();
            }
        };

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
</html>
