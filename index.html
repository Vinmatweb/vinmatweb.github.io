<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinmat.eu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Přepínač jazyků vpravo nahoře */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .lang-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            color: #f8fafc;
            border-color: #475569;
        }

        .lang-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        /* Obsah rozcestníku */
        .container {
            text-align: center;
            max-width: 650px;
            width: 100%;
            margin: auto;
            padding: 40px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* Karty s projekty */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .project-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 22px;
            text-decoration: none;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }

        .project-info {
            text-align: left;
            padding-right: 15px;
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .project-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .arrow {
            color: #38bdf8;
            font-size: 1.5rem;
            transition: transform 0.2s ease;
        }

        .project-card:hover .arrow {
            transform: translateX(4px);
        }

        /* Patička */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #1e293b;
        }

        footer a {
            color: #64748b;
            text-decoration: underline;
            margin: 0 8px;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" id="btn-cs" onclick="setLanguage('cs')">CZ</button>
    </div>

    <div class="container">
        <h1 id="main-title">Welcome to Vinmat.eu</h1>
        <p class="subtitle" id="main-subtitle">Select a project you want to visit:</p>
        
        <div class="links-grid">
            <a href="/worldforkids/" class="project-card">
                <div class="project-info">
                    <div class="project-title" id="title-kids">World for Kids</div>
                    <div class="project-desc" id="desc-kids">Library of activities for children.</div>
                </div>
                <div class="arrow">➔</div>
            </a>

            <a href="/weekify/" class="project-card">
                <div class="project-info">
                    <div class="project-title">Weekify</div>
                    <div class="project-desc" id="desc-weekify">Your web application for scheduling and productivity.</div>
                </div>
                <div class="arrow">➔</div>
            </a>
        </div>
    </div>

    <footer>
        <p>
            © 2026 Vinmat.eu · 
            <a href="privacy.html" id="link-privacy">Privacy Policy</a> · 
            <a href="terms.html" id="link-terms">Terms of Service</a>
        </p>
    </footer>

    <script>
        const translations = {
            en: {
                title: "Welcome to Vinmat's World",
                subtitle: "Select a digital project you want to visit:",
                titleKids: "World for Kids",
                kids: "A curated library of approved, illustrated mazes, coloring pages, and dot-to-dot puzzles structured into clear difficulty levels for parents and educators 🌍",
                weekify: "Need to know what week or day of the year it currently is? Or look into the past? You are in the right place, click 👉",
                privacy: "Privacy Policy",
                terms: "Terms of Service"
            },
            cs: {
                title: "Vítejte ve Vinmatově světě",
                subtitle: "Vyberte si digitální projekt, který chcete navštívit:", // VYKÁNÍ
                titleKids: "Vinmatův svět pro děti",
                kids: "Vybraná knihovna odzkoušených ilustrovaných bludišť, omalovánek a spojovaček strukturovaných do jasných úrovní obtížnosti pro rodiče a pedagogy 🌍",
                weekify: "Potřebujete vědět, kolikátý je aktuální týden nebo den v tomto roce? Nebo se podívat i do minulosti? Jste tu správně, klikněte 👉", // VYKÁNÍ SOUDRŽNÉ S PODNADPISEM
                privacy: "Zásady ochrany soukromí",
                terms: "Podmínky užití"
            }
        };

        let currentLang = localStorage.getItem('vinmat_main_lang') || 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('vinmat_main_lang', lang);

            // Aktualizace textů
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('title-kids').innerText = translations[lang].titleKids;
            document.getElementById('desc-kids').innerText = translations[lang].kids;
            document.getElementById('desc-weekify').innerText = translations[lang].weekify;
            
            // Aktualizace textů v patičce podle jazyka
            document.getElementById('link-privacy').innerText = translations[lang].privacy;
            document.getElementById('link-terms').innerText = translations[lang].terms;

            // Aktivní stav tlačítek
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-cs').classList.toggle('active', lang === 'cs');
            
            document.documentElement.lang = lang === 'cs' ? 'cs' : 'en';
        }

        setLanguage(currentLang);
    </script>
    <script data-goatcounter="https://vinmat.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
